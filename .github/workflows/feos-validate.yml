name: feos-validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: feos-validate   # the required status check name (README, github.md)
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (L2 github.md); Dependabot can bump them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (resolved 2026-10-11)
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 (resolved 2026-10-11)
        with: {python-version: "3.12"}
      - run: pip install -r scripts/requirements.txt pytest
      - name: Framework self-check
        run: python scripts/feos_validate.py
      - name: Adapter drift
        run: python scripts/feos_render.py --check
      - name: FEOS unit tests
        run: pytest -q feos-tests
      - name: Backlog
        if: hashFiles('plan/backlog.yaml') != ''
        run: python scripts/feos_validate.py --backlog plan/backlog.yaml
      - name: Traceability
        if: hashFiles('specs/prd.md') != ''
        run: python scripts/feos_trace.py
      - name: Separation of duties
        if: github.event_name == 'pull_request'
        run: python scripts/feos_guard.py --base origin/${{ github.base_ref }}
